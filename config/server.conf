==============================================================================
C++ HTTPS Server - Server Configuration
==============================================================================

[server]

Network interface to bind to.
Use 0.0.0.0 to listen on all IPv4 interfaces.

host = 0.0.0.0

HTTPS listening port.
Use 443 in a production deployment when running with appropriate privileges.

port = 8443

Maximum number of pending connections in the TCP listen queue.

listen_backlog = 128

[concurrency]

Number of worker threads used to process client connections.
A value of 0 can be interpreted by the implementation as:
std::thread::hardware_concurrency()

worker_threads = 4

Maximum number of simultaneously active client connections.

max_connections = 1024

[http]

Maximum size of the HTTP request line.
Example:
GET /api/users HTTP/1.1

max_request_line_size = 8192

Maximum combined size of HTTP request headers.

max_header_size = 16384

Maximum HTTP request body size.
10 MiB

max_body_size = 10485760

Maximum time allowed to receive/process a request.
Unit: seconds

request_timeout = 30

Amount of time an idle keep-alive connection may remain open.
Unit: seconds

keep_alive_timeout = 5

[network]

Allow reuse of the server address after restart.

reuse_address = true

Disable Nagle's algorithm when true.

tcp_no_delay = true

[logging]

Minimum log level.
Supported levels:
trace
debug
info
warning
error
critical
off

level = info

Optional log file.
Leave empty to use stderr only.

log_file =

[runtime]

Enable graceful shutdown.

graceful_shutdown = true

Maximum time to wait for active connections during shutdown.
Unit: seconds

shutdown_timeout = 10
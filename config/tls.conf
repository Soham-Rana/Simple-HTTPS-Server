==============================================================================
C++ HTTPS Server - TLS Configuration
==============================================================================

[tls]

Enable HTTPS/TLS.

enabled = true

X.509 server certificate.

certificate = certs/server.crt

Private key corresponding to the server certificate.
NEVER commit this file or expose its contents.

private_key = certs/server.key

------------------------------------------------------------------------------
TLS protocol configuration
------------------------------------------------------------------------------
Minimum TLS version accepted by the server.
Recommended:
TLSv1.3
The implementation may fall back to TLS 1.2 when explicitly configured.

minimum_version = TLSv1.3

Maximum TLS version.
"auto" allows OpenSSL to negotiate the highest supported version.

maximum_version = auto

------------------------------------------------------------------------------
Certificate configuration
------------------------------------------------------------------------------
Require the private key to match the configured certificate.

verify_private_key = true

------------------------------------------------------------------------------
Session configuration
------------------------------------------------------------------------------
Enable TLS session resumption where supported.

session_resumption = true

Session cache size.

session_cache_size = 1024

------------------------------------------------------------------------------
Security configuration
------------------------------------------------------------------------------
Disable legacy protocols.

disable_ssl_v2 = true
disable_ssl_v3 = true
disable_tls_v1_0 = true
disable_tls_v1_1 = true

------------------------------------------------------------------------------
Development notes
------------------------------------------------------------------------------
The certificate generated by:
./scripts/generate_certs.sh
is self-signed and intended only for local development.
Production deployments should use a certificate issued by a trusted
Certificate Authority.